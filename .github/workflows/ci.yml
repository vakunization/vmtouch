name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --no-deps clang-format==18.1.8
      - run: >
          clang-format --dry-run --Werror
          src/core/*.h src/core/*.cpp src/cli/*.h src/cli/*.cpp
          tests/unit/*.h tests/unit/*.cpp

  test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: plain
            build_type: Release
            sanitize: 'OFF'
          - name: sanitized
            build_type: Debug
            sanitize: 'ON'
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DVMFTOUCH_SANITIZE=${{ matrix.sanitize }}
          -DWARN_FLAGS=-Werror

      - name: Build
        run: cmake --build build --parallel

      - name: Verify sanitizer linkage
        if: matrix.sanitize == 'ON'
        run: |
          linked=$(ldd build/vmtouch)
          grep -q libasan <<< "$linked"
          grep -q libubsan <<< "$linked"

      - name: Run unit and CLI suites
        shell: bash
        env:
          LC_ALL: C
          UBSAN_OPTIONS: print_stacktrace=1
        run: |
          set -o pipefail
          ctest --test-dir build --verbose | tee test.log

      - name: Assert no sanitizer reports
        if: matrix.sanitize == 'ON'
        run: |
          if grep -E 'SanitizerTool: CHECK failed|ERROR: (AddressSanitizer|LeakSanitizer)|runtime error:|SUMMARY: UndefinedBehaviorSanitizer' test.log; then
            echo "::error::sanitizer reported issues"
            exit 1
          fi

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-log-${{ matrix.name }}
          path: test.log
          if-no-files-found: ignore
